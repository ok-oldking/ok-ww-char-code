name: Generate Static Pages and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'codes/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and git push
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate Static Pages & Team JSONs
        run: npm run build

      - name: Commit & Push Updated Static Pages to Main
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add CNAME index.html teams/ teams.json package.json package-lock.json || true
          if git diff --staged --quiet; then
            echo "No changes in generated files to commit."
          else
            # No [skip ci]: Cloudflare Pages skips such commits and would keep serving the previous teams.json.
            # A push made with GITHUB_TOKEN does not trigger this workflow again.
            git commit -m "chore: auto-generate static pages and team JSONs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
